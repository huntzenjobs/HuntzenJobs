name: CI

on:
  push:
    branches: [main, develop, "codex/**"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  PYTHON_VERSION: "3.11"

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libgdk-pixbuf-2.0-dev libffi-dev poppler-utils shared-mime-info tesseract-ocr

      - name: Dépendances Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src tests ../scripts/deployment

      - name: Pytest
        run: python -m pytest tests/unit tests/integration --tb=short --junitxml=test-results/backend.xml

      - name: Rapport Pytest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: backend/test-results/backend.xml
          if-no-files-found: warn

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-next
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend-next/package-lock.json

      - name: Dépendances Node.js
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Vitest
        run: npm run test:run -- --reporter=default --reporter=junit --outputFile.junit=reports/vitest.xml

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-key
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co

      - name: Rapport Vitest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-report
          path: frontend-next/reports/vitest.xml
          if-no-files-found: warn

  docker:
    name: Image backend
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construire l'image backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: huntzen-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
